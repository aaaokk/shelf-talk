<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>漫画 | SHELF TALK</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: #ffffff;
}

header {
    padding: 25px 18px;
    background: linear-gradient(135deg, #171326, #32104f);
}

.back {
    color: #aaa3b5;
    text-decoration: none;
    font-size: 14px;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 25px 16px 60px;
}

.icon {
    font-size: 65px;
    margin-top: 10px;
}

.tag {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #342347;
    color: #cdb4e0;
    font-size: 12px;
    margin-top: 15px;
}

h1 {
    font-size: 32px;
    margin: 12px 0;
}

.section {
    margin-top: 35px;
}

.section h2 {
    font-size: 19px;
}

.comment {
    background: #171720;
    border: 1px solid #342b40;
    border-radius: 15px;
    padding: 16px;
    margin: 12px 0;
}

.nickname {
    color: #b989d2;
    font-weight: bold;
    margin-bottom: 8px;
}

.comment p {
    margin: 0;
    line-height: 1.7;
}

.form {
    background: #171720;
    border: 1px solid #342b40;
    border-radius: 15px;
    padding: 18px;
}

input,
textarea {
    width: 100%;
    margin-top: 8px;
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #49365a;
    background: #0f0f16;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #8b5bb5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.message {
    margin-top: 12px;
    color: #aaa3b5;
}

</style>

</head>

<body>

<header>

<a class="back" href="manga.html">
← 漫画一覧へ戻る
</a>

</header>

<main>

<div class="icon">
📖
</div>

<span class="tag">
漫画
</span>

<h1 id="title">
漫画
</h1>


<div class="section">

<h2>
💭 みんなの思い出
</h2>

<div id="comments">
読み込み中……
</div>

</div>


<div class="section">

<h2>
✍️ 思い出を語ろう
</h2>

<div class="form">

<label>
ニックネーム
</label>

<input
    id="nickname"
    type="text"
    placeholder="例：たろう"
>


<label>
思い出
</label>

<textarea
    id="content"
    placeholder="この漫画との思い出を書いてみよう！"
></textarea>


<button onclick="postComment()">
投稿する
</button>

<div id="message" class="message">
</div>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jefjskatbpylokxraznx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7_jtLsbdfK6ns1HETOMcmQ_dmJutsbL";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* URLから漫画タイトルを取得 */

const params =
new URLSearchParams(location.search);

const mangaTitle =
params.get("title") || "漫画";


/* ページタイトルを変更 */

document.title =
mangaTitle + " | SHELF TALK";


/* 画面に漫画タイトルを表示 */

document.getElementById("title")
.textContent = mangaTitle;


/* 思い出を読み込む */

async function loadComments() {

    const { data, error } =
        await supabaseClient
        .from("comments")
        .select("*")
        .eq("work", mangaTitle)
        .order("id", {
            ascending: false
        });


    const area =
        document.getElementById("comments");


    if (error) {

        area.innerHTML =
            "思い出を読み込めませんでした。";

        return;

    }


    if (!data || data.length === 0) {

        area.innerHTML =
            "まだ思い出はありません。最初の思い出を書いてみよう！";

        return;

    }


    area.innerHTML =
        data.map(comment => `

            <div class="comment">

                <div class="nickname">
                    👤 ${escapeHtml(comment.nickname)}
                </div>

                <p>
                    ${escapeHtml(comment.content)}
                </p>

            </div>

        `).join("");

}


/* 思い出を投稿 */

async function postComment() {

    const nickname =
        document.getElementById("nickname")
        .value.trim();


    const content =
        document.getElementById("content")
        .value.trim();


    const message =
        document.getElementById("message");


    if (!nickname || !content) {

        message.textContent =
            "ニックネームと思い出を入力してください。";

        return;

    }


    message.textContent =
        "投稿中……";


    const { error } =
        await supabaseClient
        .from("comments")
        .insert({

            nickname: nickname,

            content: content,

            work: mangaTitle

        });


    if (error) {

        message.textContent =
            "投稿できませんでした。";

        return;

    }


    document.getElementById("nickname")
        .value = "";

    document.getElementById("content")
        .value = "";


    message.textContent =
        "投稿しました！🎉";


    loadComments();

}


/* HTMLを安全に表示 */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


loadComments();

</script>

</body>

</html>
