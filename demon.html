<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>鬼滅の刃 | SHELF TALK</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #0b0b12;
color: #fff;
}

header {
padding: 25px 18px;
background: linear-gradient(135deg, #171326, #4a1020);
}

.back {
color: #d8c1c8;
text-decoration: none;
font-size: 14px;
}

main {
max-width: 700px;
margin: auto;
padding: 25px 16px 60px;
}

.work-icon {
font-size: 70px;
margin-top: 20px;
}

h1 {
font-size: 32px;
margin: 10px 0;
}

.tag {
display: inline-block;
padding: 6px 10px;
border-radius: 20px;
background: #4a1824;
color: #f3b8c5;
font-size: 12px;
}

.section {
margin-top: 30px;
}

.section h2 {
font-size: 19px;
}

.comment {
background: #171720;
border: 1px solid #3d252c;
border-radius: 15px;
padding: 16px;
margin: 12px 0;
}

.comment p {
margin: 0 0 8px;
line-height: 1.7;
}

.nickname {
color: #f080a0;
font-weight: bold;
}

.form {
background: #171720;
border: 1px solid #3d252c;
border-radius: 15px;
padding: 18px;
margin-top: 15px;
}

input,
textarea {
width: 100%;
margin-top: 8px;
margin-bottom: 15px;
padding: 12px;
border-radius: 10px;
border: 1px solid #49303a;
background: #0f0f16;
color: white;
font-size: 15px;
}

textarea {
min-height: 120px;
resize: vertical;
}

button {
width: 100%;
padding: 14px;
border: 0;
border-radius: 10px;
background: #e63963;
color: white;
font-size: 16px;
font-weight: bold;
}

.message {
margin-top: 12px;
color: #bdb5c5;
}

.recommend {
background: linear-gradient(145deg, #2b1720, #171720);
border-radius: 15px;
padding: 18px;
margin-top: 12px;
}

</style>

</head>


<body>

<header>

<a class="back" href="manga.html">
← 漫画一覧へ戻る
</a>

</header>


<main>

<div class="work-icon">
🗡️
</div>

<span class="tag">
漫画
</span>

<h1>
鬼滅の刃
</h1>


<div class="section">

<h2>
💭 みんなの思い出
</h2>

<div id="comments">
読み込み中……
</div>

</div>


<div class="section">

<h2>
✍️ 思い出を語ろう
</h2>

<div class="form">

<label>
ニックネーム
</label>

<input
id="nickname"
type="text"
placeholder="例：たろう"
>


<label>
思い出
</label>

<textarea
id="content"
placeholder="この作品との思い出を書いてみよう！"
></textarea>


<button onclick="postComment()">
投稿する
</button>

<div id="message" class="message">
</div>

</div>

</div>


<div class="section">

<h2>
🔥 この作品が好きなら？
</h2>


<div class="recommend">

<strong>
呪術廻戦
</strong>

<br>

<span>
キャラクター同士の関係や戦いが好きな人に。
</span>

</div>


<div class="recommend">

<strong>
鋼の錬金術師
</strong>

<br>

<span>
物語とキャラクターをじっくり楽しみたい人に。
</span>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://jefjskatbpylokxraznx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7_jtLsbdfK6ns1HETOMcmQ_dmJutsbL";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function loadComments() {

const { data, error } =
await supabaseClient

.from("comments")

.select("*")

.eq("work", "鬼滅の刃")

.order("id", {
ascending: false
});


const area =
document.getElementById("comments");


if (error) {

area.innerHTML =
"思い出を読み込めませんでした。";

return;

}


if (!data || data.length === 0) {

area.innerHTML =
"まだ思い出はありません。最初の思い出を書いてみよう！";

return;

}


area.innerHTML =
data.map(comment => `

<div class="comment">

<div class="nickname">
👤 ${escapeHtml(comment.nickname)}
</div>

<p>
${escapeHtml(comment.content)}
</p>

</div>

`).join("");

}


async function postComment() {

const nickname =
document.getElementById("nickname")
.value.trim();


const content =
document.getElementById("content")
.value.trim();


const message =
document.getElementById("message");


if (!nickname || !content) {

message.textContent =
"ニックネームと思い出を入力してください。";

return;

}


message.textContent =
"投稿中……";


const { error } =
await supabaseClient

.from("comments")

.insert({

nickname: nickname,

content: content,

work: "鬼滅の刃"

});


if (error) {

message.textContent =
"投稿できませんでした。";

return;

}


document.getElementById("nickname")
.value = "";

document.getElementById("content")
.value = "";


message.textContent =
"投稿しました！🎉";


loadComments();

}


function escapeHtml(text) {

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}


loadComments();

</script>


</body>

</html>
