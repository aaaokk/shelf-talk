<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鬼滅の刃 | SHELF TALK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #fff;
}

header {
  padding: 25px 18px;
  background: linear-gradient(135deg, #171326, #4a1020);
}

.back {
  color: #d8c1c8;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 16px 60px;
}

.work-icon {
  font-size: 70px;
  margin-top: 20px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
}

.tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #4a1824;
  color: #f3b8c5;
  font-size: 12px;
}

.rating {
  color: #ffd166;
  font-size: 20px;
  margin: 15px 0 25px;
}

.section {
  margin-top: 30px;
}

.section h2 {
  font-size: 19px;
}

.comment {
  background: #171720;
  border: 1px solid #3d252c;
  border-radius: 15px;
  padding: 16px;
  margin: 12px 0;
}

.comment p {
  margin: 0 0 10px;
  line-height: 1.7;
}

.like {
  color: #aaa;
  font-size: 13px;
}

.recommend {
  background: linear-gradient(145deg, #2b1720, #171720);
  border-radius: 15px;
  padding: 18px;
  margin-top: 12px;
}

.write {
  display: block;
  width: 100%;
  margin-top: 30px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #e63963;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">← 作品一覧へ戻る</a>
</header>

<main>

  <div class="work-icon">🗡️</div>

  <span class="tag">漫画</span>

  <h1>鬼滅の刃</h1>

  <div class="rating">
    ★★★★★ 4.6
  </div>

  <div class="section">
    <h2>💬 みんなの感想</h2>

    <div class="comment">
      <p>
        キャラクターそれぞれの過去や想いが描かれていて、
        何度読んでも感情を揺さぶられる。
      </p>
      <div class="like">❤️ 10</div>
    </div>

    <div class="comment">
      <p>
        好きなキャラクターについてみんなと語りたい！
      </p>
      <div class="like">❤️ 7</div>
    </div>
  </div>

  <div class="section">
    <h2>🔥 この作品が好きなら？</h2>

    <div class="recommend">
      <strong>呪術廻戦</strong><br>
      <span>キャラクター同士の関係や戦いが好きな人に。</span>
    </div>

    <div class="recommend">
      <strong>鋼の錬金術師</strong><br>
      <span>物語とキャラクターをじっくり楽しみたい人に。</span>
    </div>
  </div>

  <button class="write" onclick="alert('感想投稿機能は次のステップで追加します！')">
    ✍️ 感想を書く
  </button>

</main>

</body>
</html>
