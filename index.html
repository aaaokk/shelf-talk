<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHELF TALK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #ffffff;
}

header {
  padding: 35px 20px;
  text-align: center;
  background: linear-gradient(135deg, #171326, #32104f);
}

.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 3px;
}

.subtitle {
  margin-top: 8px;
  color: #cfc5d8;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 16px 50px;
}

h2 {
  font-size: 20px;
  margin-bottom: 20px;
}

.card {
  background: linear-gradient(145deg, #171720, #24182f);
  border: 1px solid #422b55;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 16px;
}

.icon {
  font-size: 45px;
}

.title {
  font-size: 23px;
  font-weight: bold;
  margin-top: 10px;
}

.desc {
  color: #aaa3b5;
  margin-top: 7px;
}

.rating {
  color: #ffd166;
  margin-top: 12px;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ SHELF TALK ⚡</div>
  <div class="subtitle">
    オタクの棚から、作品を語ろう。
  </div>
</header>

<main>

  <h2>🔥 PICK UP</h2>

  <div class="card" onclick="location.href='attack.html'" style="cursor:pointer;">
  <div class="icon">⚔️</div>
  <div class="title">進撃の巨人</div>
  <div class="desc">
    あなたの感想・好きな場面を語ろう。
  </div>
  <div class="rating">
    ★★★★★ 4.8
  </div>
</div>

<div class="card" onclick="location.href='demon.html'" style="cursor:pointer;">
  <div class="icon">🗡️</div>
  <div class="title">鬼滅の刃</div>
  <div class="desc">
    好きなキャラクターや名場面を語ろう。
  </div>
  <div class="rating">
    ★★★★★ 4.6
  </div>
</div>

</main>

<footer>
  SHELF TALK
</footer>

</html>
