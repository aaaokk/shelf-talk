<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>漫画 - SHELF TALK</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: #ffffff;
}

header {
    padding: 30px 20px;
    text-align: center;
    background: linear-gradient(135deg, #171326, #32104f);
}

.back {
    display: block;
    text-align: left;
    max-width: 700px;
    margin: 0 auto 15px;
    color: #aaa3b5;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    color: #ffffff;
}

.icon {
    font-size: 45px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-top: 8px;
}

.subtitle {
    margin-top: 8px;
    color: #cfc5d8;
    font-size: 14px;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 30px 16px 50px;
}

.section-title {
    font-size: 20px;
    margin-bottom: 20px;
}

.card {
    background: linear-gradient(145deg, #171720, #24182f);
    border: 1px solid #422b55;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #8b5bb5;
}

.work-icon {
    font-size: 40px;
}

.title {
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
}

.desc {
    color: #aaa3b5;
    margin-top: 7px;
    font-size: 14px;
    line-height: 1.6;
}

.empty {
    color: #aaa3b5;
    padding: 20px 0;
}

.error {
    color: #d88;
    padding: 20px 0;
}

footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    padding: 30px;
}

</style>

</head>

<body>

<header>

    <a href="index.html" class="back">
        ← SHELF TALK
    </a>

    <div class="icon">📚</div>

    <div class="logo">
        漫画
    </div>

    <div class="subtitle">
        あなたの思い出に残っている漫画を語ろう。
    </div>

</header>


<main>

    <div class="section-title">
        📖 漫画の思い出
    </div>


    <div id="works">
        読み込み中……
    </div>


    <div
        class="card"
        onclick="location.href='add-manga.html'"
    >

        <div class="work-icon">
            ＋
        </div>

        <div class="title">
            思い出の漫画を追加する
        </div>

        <div class="desc">
            あなたの好きな漫画を追加しよう。
        </div>

    </div>

</main>


<footer>
    SHELF TALK
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jefjskatbpylokxraznx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_7_jtLsbdf6ns1HETOMcmQ_dmJutsbL";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   漫画一覧を読み込む
========================= */

async function loadWorks() {

    const area =
        document.getElementById("works");


    const {
        data,
        error
    } =
        await supabaseClient
            .from("works")
            .select("*")
            .eq("category", "漫画")
            .order("id", {
                ascending: true
            });


    if (error) {

        console.error(
            "works読み込みエラー:",
            error
        );

        area.innerHTML = `

            <div class="error">

                漫画一覧を読み込めませんでした。

            </div>

        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        area.innerHTML = `

            <div class="empty">

                まだ漫画がありません。

            </div>

        `;

        return;
    }


    area.innerHTML =

        data.map(
            work => {

                let icon = "📖";


                /*
                作品ごとのアイコン
                */

                if (
                    work.title === "進撃の巨人"
                ) {

                    icon = "⚔️";

                }

                else if (
                    work.title === "鬼滅の刃"
                ) {

                    icon = "🗡️";

                }

                else if (
                    work.title === "ONE PIECE"
                ) {

                    icon = "🏴‍☠️";

                }

                else if (
                    work.title === "NARUTO"
                ) {

                    icon = "🍥";

                }


                /*
                作品カード
                */

                return `

                    <div
                        class="card"
                        onclick="openWork(${work.id})"
                    >

                        <div class="work-icon">

                            ${icon}

                        </div>

                        <div class="title">

                            ${escapeHtml(
                                work.title
                            )}

                        </div>

                        <div class="desc">

                            あなたの思い出を語ろう。

                        </div>

                    </div>

                `;

            }

        ).join("");

}


/* =========================
   作品ページを開く
========================= */

function openWork(id) {

    location.href =
        "work.html?id=" +
        encodeURIComponent(id);

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================
   開始
========================= */

loadWorks();

</script>

</body>

</html>
