<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>漫画を追加 | SHELF TALK</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: #ffffff;
}

header {
    padding: 25px 18px;
    background: linear-gradient(135deg, #171326, #32104f);
}

.back {
    color: #aaa3b5;
    text-decoration: none;
    font-size: 14px;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 35px 16px 60px;
}

.icon {
    font-size: 60px;
    text-align: center;
}

h1 {
    text-align: center;
    font-size: 27px;
    margin: 15px 0 8px;
}

.subtitle {
    text-align: center;
    color: #aaa3b5;
    font-size: 14px;
    margin-bottom: 30px;
}

.form {
    background: linear-gradient(145deg, #171720, #24182f);
    border: 1px solid #422b55;
    border-radius: 18px;
    padding: 22px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #49365a;
    background: #0f0f16;
    color: white;
    font-size: 16px;
    margin-bottom: 18px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #8b5bb5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #a66dce;
}

button:disabled {
    background: #555;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    color: #aaa3b5;
    font-size: 14px;
    line-height: 1.6;
}

</style>

</head>

<body>

<header>

<a href="manga.html" class="back">
← 漫画一覧へ戻る
</a>

</header>

<main>

<div class="icon">
📚
</div>

<h1>
思い出の漫画を追加する
</h1>

<div class="subtitle">
あなたの心に残っている漫画を教えてください。
</div>

<div class="form">

<label for="mangaName">
漫画のタイトル
</label>

<input
    id="mangaName"
    type="text"
    placeholder="例：ONE PIECE"
    autocomplete="off"
>

<button
    id="addButton"
    onclick="addManga()"
>
この漫画を追加する
</button>

<div
    id="message"
    class="message"
></div>

</div>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
    "https://jefjskatbpylokxraznx.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_7_jtLsbdfK6ns1HETOMcmQ_dmJutsbL";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/*
=================================
漫画を追加
=================================
*/

async function addManga() {


    const input =
        document.getElementById(
            "mangaName"
        );


    const button =
        document.getElementById(
            "addButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const name =
        input.value.trim();



    /*
    タイトルが空の場合
    */

    if (!name) {

        message.textContent =
            "漫画のタイトルを入力してください。";

        return;

    }



    /*
    保存中
    */

    button.disabled = true;

    button.textContent =
        "追加中……";

    message.textContent =
        "";



    /*
    すでに登録されているか確認
    */

    const {
        data: existing,
        error: checkError
    } =
        await supabaseClient

            .from("works")

            .select("id, title")

            .eq(
                "title",
                name
            )

            .eq(
                "category",
                "漫画"
            )

            .maybeSingle();



    /*
    確認エラー
    */

    if (checkError) {

        console.error(checkError);

        message.textContent =
            "漫画を確認できませんでした。";

        button.disabled = false;

        button.textContent =
            "この漫画を追加する";

        return;

    }



    /*
    すでに存在する場合
    */

    if (existing) {

        message.textContent =
            "この漫画はすでに追加されています。";

        button.disabled = false;

        button.textContent =
            "この漫画を追加する";

        return;

    }



    /*
    worksに追加
    */

    const {
        data,
        error
    } =
        await supabaseClient

            .from("works")

            .insert({

                title:
                    name,

                category:
                    "漫画"

            })

            .select()
            .single();



    /*
    保存エラー
    */

    if (error) {

        console.error(error);

        message.textContent =
            "漫画を追加できませんでした。";

        button.disabled = false;

        button.textContent =
            "この漫画を追加する";

        return;

    }



    /*
    追加成功
    */

    message.textContent =
        "漫画を追加しました。漫画一覧へ移動します……";



    /*
    少し待って一覧へ
    */

    setTimeout(
        function() {

            location.href =
                "manga.html";

        },
        700
    );

}


</script>

</body>

</html>
