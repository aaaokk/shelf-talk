<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進撃の巨人 | SHELF TALK</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #fff;
}

header {
  padding: 25px 18px;
  background: linear-gradient(135deg, #171326, #32104f);
}

.back {
  color: #c9b7d8;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 16px 60px;
}

.work-icon {
  font-size: 70px;
  margin-top: 20px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
}

.tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #3a2350;
  color: #d9b8f2;
  font-size: 12px;
}

.rating {
  color: #ffd166;
  font-size: 20px;
  margin: 15px 0 25px;
}

.section {
  margin-top: 30px;
}

.section h2 {
  font-size: 19px;
}

/* 思い出カード */

.memory {
  background: #171720;
  border: 1px solid #33263d;
  border-radius: 15px;
  padding: 18px;
  margin: 12px 0;
}

.memory-meta {
  color: #e8dff0;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.7;
  margin-bottom: 10px;
}

.memory-detail {
  color: #bdb5c5;
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 10px;
}

.memory-content {
  margin: 12px 0 0;
  padding-top: 12px;
  border-top: 1px solid #33263d;
  line-height: 1.7;
  color: #fff;
}

.nickname {
  color: #c084fc;
  font-weight: bold;
  font-size: 13px;
  margin-top: 10px;
}

/* フォーム */

.form {
  background: #171720;
  border: 1px solid #33263d;
  border-radius: 15px;
  padding: 18px;
  margin-top: 15px;
}

.form label {
  display: block;
  margin-top: 5px;
  font-size: 14px;
  color: #d9d1df;
}

input,
textarea {
  width: 100%;
  margin-top: 8px;
  margin-bottom: 15px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #493954;
  background: #0f0f16;
  color: white;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #a855f7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #9333ea;
}

.message {
  margin-top: 12px;
  color: #bdb5c5;
}

.empty {
  background: #171720;
  border: 1px solid #33263d;
  border-radius: 15px;
  padding: 20px;
  color: #bdb5c5;
  line-height: 1.7;
}

/* おすすめ */

.recommend {
  background: linear-gradient(145deg, #21172b, #171720);
  border-radius: 15px;
  padding: 18px;
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">← 作品一覧へ戻る</a>
</header>

<main>

  <div class="work-icon">⚔️</div>

  <span class="tag">漫画</span>

  <h1>進撃の巨人</h1>

  <div class="rating">
    ★★★★★ 4.8
  </div>

  <!-- みんなの思い出 -->

  <div class="section">
    <h2>🕰️ みんなの思い出</h2>

    <div id="comments">
      読み込み中……
    </div>
  </div>

  <!-- 思い出を投稿 -->

  <div class="section">
    <h2>✍️ あなたの思い出を残す</h2>

    <div class="form">

      <label>ニックネーム</label>
      <input
        id="nickname"
        type="text"
        placeholder="例：たろう"
      >

      <label>いつ？</label>
      <input
        id="when_text"
        type="text"
        placeholder="例：2014年、高校生のころ"
      >

      <label>どこで？</label>
      <input
        id="where_text"
        type="text"
        placeholder="例：自分の部屋"
      >

      <label>誰と？</label>
      <input
        id="with_who"
        type="text"
        placeholder="例：友達と"
      >

      <label>ひとこと（任意）</label>
      <textarea
        id="content"
        placeholder="そのときのことを少しだけ。"
      ></textarea>

      <button onclick="postMemory()">
        思い出を残す
      </button>

      <div id="message" class="message"></div>

    </div>
  </div>

  <!-- おすすめ -->

  <div class="section">
    <h2>🔥 この作品が好きなら？</h2>

    <div class="recommend">
      <strong>HUNTER×HUNTER</strong><br>
      <span>世界観や伏線が好きな人におすすめ。</span>
    </div>

    <div class="recommend">
      <strong>鋼の錬金術師</strong><br>
      <span>物語をじっくり楽しみたい人に。</span>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jefjskatbpylokxraznx.supabase.co";
const SUPABASE_KEY = "sb_publishable_7_jtLsbdfK6ns1HETOMcmQ_dmJutsbL";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   思い出を読み込む
========================= */

async function loadMemories() {

  const { data, error } = await supabaseClient
    .from("comments")
    .select("*")
    .eq("work", "進撃の巨人")
    .not("when_text", "is", null)
    .order("id", { ascending: false });

  const area = document.getElementById("comments");

  if (error) {
    area.innerHTML = "思い出を読み込めませんでした。";
    return;
  }

  if (!data || data.length === 0) {
    area.innerHTML = `
      <div class="empty">
        まだ思い出はありません。<br>
        あなたの最初の思い出を残してみよう。
      </div>
    `;
    return;
  }

  area.innerHTML = data.map(memory => {

    const nickname = escapeHtml(memory.nickname || "");
    const whenText = escapeHtml(memory.when_text || "");
    const whereText = escapeHtml(memory.where_text || "");
    const withWho = escapeHtml(memory.with_who || "");
    const content = escapeHtml(memory.content || "");

    return `
      <div class="memory">

        <div class="memory-meta">
          ${whenText}
        </div>

        <div class="memory-detail">
          📍 ${whereText}<br>
          👥 ${withWho}
        </div>

        ${
          content
            ? `<div class="memory-content">「${content}」</div>`
            : ""
        }

        ${
          nickname
            ? `<div class="nickname">👤 ${nickname}</div>`
            : ""
        }

      </div>
    `;

  }).join("");
}


/* =========================
   思い出を投稿
========================= */

async function postMemory() {

  const nickname = document
    .getElementById("nickname")
    .value
    .trim();

  const whenText = document
    .getElementById("when_text")
    .value
    .trim();

  const whereText = document
    .getElementById("where_text")
    .value
    .trim();

  const withWho = document
    .getElementById("with_who")
    .value
    .trim();

  const content = document
    .getElementById("content")
    .value
    .trim();

  const message = document.getElementById("message");


  /* 必須項目をチェック */

  if (!whenText || !whereText || !withWho) {
    message.textContent =
      "「いつ・どこで・誰と」を入力してください。";
    return;
  }


  message.textContent = "保存中……";


  /* Supabaseに保存 */

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      nickname: nickname,
      when_text: whenText,
      where_text: whereText,
      with_who: withWho,
      content: content,
      work: "進撃の巨人"
    });


  if (error) {

    console.error(error);

    message.textContent =
      "保存できませんでした。";

    return;
  }


  /* フォームを空にする */

  document.getElementById("nickname").value = "";
  document.getElementById("when_text").value = "";
  document.getElementById("where_text").value = "";
  document.getElementById("with_who").value = "";
  document.getElementById("content").value = "";


  message.textContent =
    "思い出を残しました。";


  /* 一覧を更新 */

  loadMemories();
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   初期読み込み
========================= */

loadMemories();

</script>

</body>
</html>
