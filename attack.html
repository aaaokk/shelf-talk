<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進撃の巨人 | SHELF TALK</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #fff;
}

header {
  padding: 25px 18px;
  background: linear-gradient(135deg, #171326, #32104f);
}

.back {
  color: #c9b7d8;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 16px 60px;
}

.work-icon {
  font-size: 70px;
  margin-top: 20px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
}

.tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #3a2350;
  color: #d9b8f2;
  font-size: 12px;
}

.rating {
  color: #ffd166;
  font-size: 20px;
  margin: 15px 0 25px;
}

.section {
  margin-top: 30px;
}

.section h2 {
  font-size: 19px;
}

.comment {
  background: #171720;
  border: 1px solid #33263d;
  border-radius: 15px;
  padding: 16px;
  margin: 12px 0;
}

.comment p {
  margin: 0 0 8px;
  line-height: 1.7;
}

.nickname {
  color: #c084fc;
  font-weight: bold;
}

.form {
  background: #171720;
  border: 1px solid #33263d;
  border-radius: 15px;
  padding: 18px;
  margin-top: 15px;
}

input, textarea {
  width: 100%;
  margin-top: 8px;
  margin-bottom: 15px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #493954;
  background: #0f0f16;
  color: white;
  font-size: 15px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #a855f7;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.message {
  margin-top: 12px;
  color: #bdb5c5;
}

.recommend {
  background: linear-gradient(145deg, #21172b, #171720);
  border-radius: 15px;
  padding: 18px;
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">← 作品一覧へ戻る</a>
</header>

<main>

  <div class="work-icon">⚔️</div>

  <span class="tag">漫画</span>

  <h1>進撃の巨人</h1>

  <div class="rating">
    ★★★★★ 4.8
  </div>

  <div class="section">
    <h2>💬 みんなの感想</h2>

    <div id="comments">
      読み込み中……
    </div>
  </div>

  <div class="section">
    <h2>✍️ 感想を書く</h2>

    <div class="form">

      <label>ニックネーム</label>
      <input id="nickname" type="text" placeholder="例：たろう">

      <label>感想</label>
      <textarea id="content" placeholder="この作品の好きなところを書いてみよう！"></textarea>

      <button onclick="postComment()">投稿する</button>

      <div id="message" class="message"></div>

    </div>
  </div>

  <div class="section">
    <h2>🔥 この作品が好きなら？</h2>

    <div class="recommend">
      <strong>HUNTER×HUNTER</strong><br>
      <span>世界観や伏線が好きな人におすすめ。</span>
    </div>

    <div class="recommend">
      <strong>鋼の錬金術師</strong><br>
      <span>物語をじっくり楽しみたい人に。</span>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jefjskatbpylokxraznx.supabase.co";
const SUPABASE_KEY = "sb_publishable_7_jtLsbdfK6ns1HETOMcmQ_dmJutsbL";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadComments() {

  const { data, error } = await supabaseClient
    .from("comments")
    .select("*")
    .eq("work", "進撃の巨人")
    .order("id", { ascending: false });

  const area = document.getElementById("comments");

  if (error) {
    area.innerHTML = "感想を読み込めませんでした。";
    return;
  }

  if (!data || data.length === 0) {
    area.innerHTML = "まだ感想はありません。最初の感想を書いてみよう！";
    return;
  }

  area.innerHTML = data.map(comment => `
    <div class="comment">
      <div class="nickname">👤 ${escapeHtml(comment.nickname)}</div>
      <p>${escapeHtml(comment.content)}</p>
    </div>
  `).join("");
}

async function postComment() {

  const nickname = document.getElementById("nickname").value.trim();
  const content = document.getElementById("content").value.trim();
  const message = document.getElementById("message");

  if (!nickname || !content) {
    message.textContent = "ニックネームと感想を入力してください。";
    return;
  }

  message.textContent = "投稿中……";

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      nickname: nickname,
      content: content,
      work: "進撃の巨人"
    });

  if (error) {
    message.textContent = "投稿できませんでした。";
    return;
  }

  document.getElementById("nickname").value = "";
  document.getElementById("content").value = "";

  message.textContent = "投稿しました！🎉";

  loadComments();
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

loadComments();
</script>

</body>
</html>
