<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進撃の巨人 | SHELF TALK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #fff;
}

header {
  padding: 25px 18px;
  background: linear-gradient(135deg, #171326, #32104f);
}

.back {
  color: #c9b7d8;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 16px 60px;
}

.work-icon {
  font-size: 70px;
  margin-top: 20px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
}

.tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #3a2350;
  color: #d9b8f2;
  font-size: 12px;
}

.rating {
  color: #ffd166;
  font-size: 20px;
  margin: 15px 0 25px;
}

.section {
  margin-top: 30px;
}

.section h2 {
  font-size: 19px;
}

.comment {
  background: #171720;
  border: 1px solid #33263d;
  border-radius: 15px;
  padding: 16px;
  margin: 12px 0;
}

.comment p {
  margin: 0 0 10px;
  line-height: 1.7;
}

.like {
  color: #aaa;
  font-size: 13px;
}

.recommend {
  background: linear-gradient(145deg, #21172b, #171720);
  border-radius: 15px;
  padding: 18px;
  margin-top: 12px;
}

.write {
  display: block;
  width: 100%;
  margin-top: 30px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #a855f7;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">← 作品一覧へ戻る</a>
</header>

<main>

  <div class="work-icon">⚔️</div>

  <span class="tag">漫画</span>

  <h1>進撃の巨人</h1>

  <div class="rating">
    ★★★★★ 4.8
  </div>

  <div class="section">
    <h2>💬 みんなの感想</h2>

    <div class="comment">
      <p>
        最初は謎だらけだったけど、読み進めるほど
        世界観に引き込まれた！
      </p>
      <div class="like">❤️ 12</div>
    </div>

    <div class="comment">
      <p>
        好きなキャラクターについて語りたい。
        何度も読み返したくなる作品。
      </p>
      <div class="like">❤️ 8</div>
    </div>
  </div>

  <div class="section">
    <h2>🔥 この作品が好きなら？</h2>

    <div class="recommend">
      <strong>HUNTER×HUNTER</strong><br>
      <span>世界観や伏線が好きな人におすすめ。</span>
    </div>

    <div class="recommend">
      <strong>鋼の錬金術師</strong><br>
      <span>物語をじっくり楽しみたい人に。</span>
    </div>
  </div>

  <button class="write" onclick="alert('感想投稿機能は次のステップで追加します！')">
    ✍️ 感想を書く
  </button>

</main>

</body>
</html>
